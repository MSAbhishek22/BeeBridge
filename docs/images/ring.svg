<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#171310"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="30" fill="#9DB8D9">BEE HEARD, IN A CALL WITH MOM:</text>
  <text x="60" y="140" font-family="Georgia, serif" font-size="36" fill="#FFFFFF">&#8220;Mom said a package is expected and the delivery</text>
  <text x="60" y="185" font-family="Georgia, serif" font-size="36" fill="#FFFFFF">is arriving tomorrow.&#8221;</text>
  <text x="60" y="260" font-family="Georgia, serif" font-size="30" fill="#9DB8D9">RING SEES IT ARRIVE. ALEXA ANNOUNCES:</text>
  <text x="60" y="315" font-family="Georgia, serif" font-size="34" fill="#F5C542">&#8220;Your package has arrived at the front door.&#8221;</text>
  <text x="60" y="380" font-family="Georgia, serif" font-size="28" fill="#E8DCC8">And the reminder completes itself — nothing left to remember.</text>
</svg>

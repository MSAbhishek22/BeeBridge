<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#171310"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="30" fill="#9DB8D9">BEE HEARD, ON TUESDAY:</text>
  <text x="60" y="140" font-family="Georgia, serif" font-size="38" fill="#FFFFFF">&#8220;A package is expected tomorrow.&#8221;</text>
  <text x="60" y="230" font-family="Georgia, serif" font-size="30" fill="#9DB8D9">RING SEES IT ARRIVE. ALEXA ANNOUNCES:</text>
  <text x="60" y="290" font-family="Georgia, serif" font-size="34" fill="#F5C542">&#8220;Your package has arrived.&#8221;</text>
  <text x="60" y="345" font-family="Georgia, serif" font-size="28" fill="#E8DCC8">And the reminder completes itself — nothing left to remember.</text>
</svg>
